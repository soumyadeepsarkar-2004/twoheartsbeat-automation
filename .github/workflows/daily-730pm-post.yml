name: Daily 7:30 PM Instagram Publisher

on:
  schedule:
    # 14:00 UTC is exactly 19:30 IST (7:30 PM IST) primary cron
    - cron: '0 14 * * *'
    # 15:00 UTC is 20:30 IST (8:30 PM IST) 1-hour catch-up
    - cron: '0 15 * * *'
    # 17:00 UTC is 22:30 IST (10:30 PM IST) late evening catch-up
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      target_day:
        description: 'Target Day to publish (leave blank for automatic next day)'
        required: false
        default: ''
      force:
        description: 'Force publish even if already published today (true/false)'
        required: false
        default: 'false'

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish Today's Post to Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TARGET_DAY_INPUT: ${{ github.event.inputs.target_day }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          CMD="python cloud_publisher.py"
          if [ -n "$TARGET_DAY_INPUT" ]; then
            CMD="$CMD --day $TARGET_DAY_INPUT"
          fi
          if [ "$FORCE_INPUT" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Executing: $CMD"
          $CMD

      - name: Commit Updated Operating Log and State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add log.md published_state.json processed_comments.json
          if ! git diff --cached --quiet; then
            echo "Changes detected in operating log, state, or processed comments. Committing..."
            git commit -m "Auto-update operating log and state [skip ci]"
            git pull --rebase origin main || true
            git push origin main || (git pull --rebase -Xours origin main && git push origin main)
          else
            echo "Working tree is clean. Nothing to commit."
          fi
