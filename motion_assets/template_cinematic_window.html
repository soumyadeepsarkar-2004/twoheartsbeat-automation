<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two Hearts Beat - Cinematic Rail Journey & Sound Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #050711;
    color: #FFFFFF;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Rain & Night Train Bokeh Background */
  .bg-window {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 30%, rgba(255, 122, 89, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 20% 70%, rgba(56, 189, 248, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(13, 18, 35, 0.9) 0%, #03050B 100%);
  }

  /* Bokeh Light Spheres */
  .bokeh-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.4;
    animation: driftBokeh 10s ease-in-out infinite alternate;
  }
  .orb-1 { width: 320px; height: 320px; background: #FF7A59; top: 15%; left: 10%; animation-delay: 0s; }
  .orb-2 { width: 280px; height: 280px; background: #38BDF8; top: 40%; right: 5%; animation-delay: 3s; }
  .orb-3 { width: 350px; height: 350px; background: #C8FF4F; bottom: 20%; left: 25%; animation-delay: 6s; }

  @keyframes driftBokeh {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-40px) scale(1.15); }
  }

  /* Rain streaks on glass overlay */
  .rain-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(2px 30px at 20% 30%, rgba(255, 255, 255, 0.4), transparent),
      radial-gradient(1.5px 25px at 60% 40%, rgba(255, 255, 255, 0.35), transparent),
      radial-gradient(2px 40px at 80% 65%, rgba(255, 255, 255, 0.3), transparent),
      radial-gradient(1.5px 20px at 35% 85%, rgba(255, 255, 255, 0.4), transparent);
    background-size: 180px 180px;
    opacity: 0.6;
  }

  .stage {
    position: absolute;
    inset: 70px 50px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  /* Journey Transit Header */
  .transit-header {
    background: rgba(15, 22, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 28px;
    padding: 22px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(25px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
  }
  .transit-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: #38BDF8;
    letter-spacing: 0.5px;
  }
  .transit-dot {
    width: 10px;
    height: 10px;
    background: #34D399;
    border-radius: 50%;
    box-shadow: 0 0 10px #34D399;
    animation: livePing 1.8s infinite;
  }
  @keyframes livePing {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }
  .time-badge {
    font-family: 'DM Mono', monospace;
    font-size: 19px;
    font-weight: 600;
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px 16px;
    border-radius: 999px;
  }

  /* Animated Route Map & Distance HUD */
  .route-bridge-box {
    background: rgba(11, 16, 32, 0.9);
    border: 1.5px solid rgba(56, 189, 248, 0.3);
    border-radius: 36px;
    padding: 36px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    margin: 20px 0;
    backdrop-filter: blur(30px);
  }
  .route-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .route-label {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .route-distance-badge {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: #FF7A59;
    background: rgba(255, 122, 89, 0.12);
    border: 1px solid rgba(255, 122, 89, 0.35);
    padding: 6px 18px;
    border-radius: 999px;
  }

  /* City Terminals */
  .terminals-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    padding: 10px 15px;
  }
  .city-block {
    text-align: center;
    z-index: 5;
  }
  .city-name {
    font-size: 32px;
    font-weight: 800;
    color: #FFFFFF;
    margin-bottom: 4px;
  }
  .city-status {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    color: #34D399;
  }

  /* Dynamic Route Track SVG */
  .route-track-svg {
    position: absolute;
    top: 50%;
    left: 220px;
    right: 220px;
    height: 12px;
    transform: translateY(-50%);
  }
  .route-line-bg {
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 3px;
    stroke-dasharray: 6 6;
  }
  .route-line-active {
    stroke: url(#pulseGrad);
    stroke-width: 4px;
    stroke-linecap: round;
    animation: pulseTrack 2s linear infinite;
  }
  @keyframes pulseTrack {
    0% { stroke-dashoffset: 100; }
    100% { stroke-dashoffset: 0; }
  }

  /* Emotional Quote Hero Card */
  .quote-hero-card {
    background: linear-gradient(165deg, rgba(26, 34, 60, 0.95), rgba(12, 17, 34, 0.98));
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-radius: 36px;
    padding: 44px 40px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(35px);
  }
  .quote-symbol {
    font-size: 40px;
    color: #FF7A59;
    margin-bottom: 12px;
  }
  .quote-text {
    font-family: 'Playfair Display', serif;
    font-size: 44px;
    font-style: italic;
    font-weight: 600;
    line-height: 1.35;
    color: #FFFFFF;
    margin-bottom: 24px;
  }
  .quote-sub {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.5;
  }
  .quote-sub em {
    font-style: normal;
    color: #38BDF8;
    font-weight: 700;
  }

  /* Live Synced Player Widget */
  .audio-bridge-player {
    background: rgba(14, 20, 38, 0.92);
    border: 1.5px solid rgba(56, 189, 248, 0.35);
    border-radius: 30px;
    padding: 26px 30px;
    display: flex;
    align-items: center;
    gap: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .vinyl-spin {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle, #2C3550 35%, #0B0E1B 80%);
    border: 2px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 0 25px rgba(255, 122, 89, 0.35);
    animation: spinVinyl 6s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spinVinyl {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .player-info {
    flex: 1;
  }
  .player-title {
    font-size: 28px;
    font-weight: 800;
    color: #FFFFFF;
    margin-bottom: 4px;
  }
  .player-artist {
    font-size: 19px;
    color: rgba(255, 255, 255, 0.65);
    font-weight: 500;
  }
  .live-spectrum {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 40px;
    margin-top: 10px;
  }
  .spec-bar {
    width: 5px;
    background: linear-gradient(180deg, #38BDF8, #34D399);
    border-radius: 999px;
    animation: barPulse 1.2s infinite alternate;
  }
  .spec-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
  .spec-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
  .spec-bar:nth-child(3) { height: 60%; animation-delay: 0.15s; }
  .spec-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }
  .spec-bar:nth-child(5) { height: 75%; animation-delay: 0.25s; }
  .spec-bar:nth-child(6) { height: 45%; animation-delay: 0.35s; }

  @keyframes barPulse {
    0% { transform: scaleY(0.3); }
    100% { transform: scaleY(1); }
  }

  /* Bottom Call to Action */
  .cta-box {
    background: linear-gradient(135deg, rgba(200, 255, 79, 0.15), rgba(56, 189, 248, 0.15));
    border: 2px solid #C8FF4F;
    border-radius: 28px;
    padding: 26px 30px;
    text-align: center;
    box-shadow: 0 0 40px rgba(200, 255, 79, 0.25);
  }
  .cta-main {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .cta-main span {
    color: #C8FF4F;
  }
  .cta-footnote {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <div class="bg-window"></div>
  <div class="bokeh-orb orb-1"></div>
  <div class="bokeh-orb orb-2"></div>
  <div class="bokeh-orb orb-3"></div>
  <div class="rain-overlay"></div>

  <div class="stage">
    <!-- Transit Header -->
    <header class="transit-header">
      <div class="transit-badge">
        <div class="transit-dot"></div>
        <span>LIVE AUDIO BRIDGE</span>
      </div>
      <div class="time-badge">02:14 AM IST</div>
    </header>

    <!-- Route Map & Distance HUD -->
    <div class="route-bridge-box">
      <div class="route-title-row">
        <div class="route-label">INTER-CITY AUDIO SYNC CORRIDOR</div>
        <div class="route-distance-badge">{{DISTANCE}}</div>
      </div>
      <div class="terminals-row">
        <div class="city-block">
          <div class="city-name">{{CITY1}}</div>
          <div class="city-status">CONNECTED 🎧</div>
        </div>

        <svg class="route-track-svg" viewBox="0 0 400 12">
          <defs>
            <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF7A59" />
              <stop offset="50%" stop-color="#38BDF8" />
              <stop offset="100%" stop-color="#34D399" />
            </linearGradient>
          </defs>
          <line class="route-line-bg" x1="10" y1="6" x2="390" y2="6" />
          <line class="route-line-active" x1="10" y1="6" x2="390" y2="6" stroke-dasharray="80 120" />
        </svg>

        <div class="city-block">
          <div class="city-name">{{CITY2}}</div>
          <div class="city-status">0.00 MS DELAY 🫀</div>
        </div>
      </div>
    </div>

    <!-- Emotional Quote Hero -->
    <div class="quote-hero-card">
      <div class="quote-symbol">❝</div>
      <div class="quote-text">{{QUOTE}}</div>
      <div class="quote-sub">{{SUBTITLE}}</div>
    </div>

    <!-- Active Song Information Card with Audio Spectrum -->
    <div class="audio-bridge-player">
      <div class="vinyl-spin">💿</div>
      <div class="player-info">
        <div class="player-title">{{TRACK_TITLE}}</div>
        <div class="player-artist">{{TRACK_ARTIST}}</div>
        <div class="live-spectrum">
          <div class="spec-bar"></div>
          <div class="spec-bar"></div>
          <div class="spec-bar"></div>
          <div class="spec-bar"></div>
          <div class="spec-bar"></div>
          <div class="spec-bar"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Action Card -->
    <div class="cta-box">
      <div class="cta-main">Comment <span>"SYNC"</span> to Listen Together</div>
      <div class="cta-footnote">Free · No App Download · twoheartsbeat.live</div>
    </div>
  </div>
</body>
</html>
